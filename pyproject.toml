[project]
name = "agisnest"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["scapy>=2.6,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "shap>=0.47,<1", "torch>=2.6,<3", "psutil>=6,<8", "httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "flask>=3,<4", "flask-cors>=5,<7"]

[tool.uv]
constraint-dependencies = ["shap==0.48.0", "numba==0.61.2", "llvmlite==0.44.0", "numpy==2.2.6", "torch==2.7.1", "scikit-learn==1.6.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
